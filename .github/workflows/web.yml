name: Web placeholder

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/web/**'
      - '.github/workflows/web.yml'

jobs:
  placeholder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Web client status
        run: |
          test -f app/web/README.md
          echo 'app/web is reserved; choose a framework before replacing this workflow.'
