name: store
description: Local SQLite persistence (drift). Owns tables and queries, knows nothing about FSRS.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.8.0

dependencies:
  domain:
    path: ../domain
  drift: ^2.20.0
  # IANA zones. Dart core knows only UTC and "local", and §5.7 needs a stored
  # timezone so the heatmap does not rewrite itself when the user travels.
  timezone: ^0.9.4

dev_dependencies:
  build_runner: ^2.4.0
  drift_dev: ^2.20.0
  sqlite3: ^2.4.0
  test: ^1.25.0
