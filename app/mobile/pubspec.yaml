name: flashcards
description: Mnemos — terminal físico-digital para estudo deliberado e revisão adaptativa.
publish_to: none
version: 0.4.0

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # The logic lives in packages; lib/ is composition and screens (§4.4).
  domain:
    path: packages/domain
  scheduler:
    path: packages/scheduler
  store:
    path: packages/store
  session:
    path: packages/session
  authoring:
    path: packages/authoring
  api_client:
    path: packages/api_client
  progress:
    path: packages/progress
  sync_client:
    path: packages/sync_client

  # §4.4 — providers are testable without a widget tree, which is what makes
  # "light on widget tests" honest rather than a gap.
  flutter_riverpod: ^2.6.0
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  path_provider: ^2.1.0
  timezone: ^0.9.4
  # §11.6 — on-device, offline, nothing sent to the server.
  # §8.2 — tokens are credentials; they live in the platform keychain, not
  # in the database next to the study data.
  # §5.6 — camera and gallery for a photo, a file picker for a PDF.
  file_picker: ^8.1.0
  flutter_secure_storage: ^9.2.0
  image_picker: ^1.1.0
  # §8.4 — an export has to be able to leave the phone.
  share_plus: ^10.0.0
  flutter_tts: ^4.2.0
  flutter_local_notifications: ^18.0.0
  mobile_scanner: ^7.4.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # In-memory database for tests, so composition is exercised without a device.
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.0

flutter:
  uses-material-design: true

  # Bundled rather than fetched at runtime: §2.2 makes the app work offline
  # from the first launch, and a typeface that arrives on the second launch
  # would make the first one a different product.
  fonts:
    # Titles, section headings and every large numeral (§ design "Mnemos App").
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Regular.ttf
          weight: 400
        - asset: assets/fonts/Literata-SemiBold.ttf
          weight: 600
    # Body copy and interface labels.
    - family: Public Sans
      fonts:
        - asset: assets/fonts/PublicSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PublicSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PublicSans-SemiBold.ttf
          weight: 600
    # Eyebrows and tabular data, where the fixed advance is the point.
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
