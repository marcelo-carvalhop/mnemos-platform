[platformio]
default_envs = t5s3-pro-bench

[env:t5s3-pro]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 460800

board_upload.flash_size = 16MB
board_upload.maximum_size = 6553600
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
board_build.partitions = partitions/t5s3_pro_factory_layout.csv

build_flags =
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_RUNNING_CORE=1
    -D ARDUINO_EVENT_RUNNING_CORE=1
    -D CORE_DEBUG_LEVEL=0
    -D MNEMOS_T5S3_PRO=1
    -D MNEMOS_EXTERNAL_I2C_DRIVER=1

; Só os fontes do projeto; bibliotecas vendorizadas mantêm os avisos padrão.
build_src_flags =
    -Wall
    -Wextra

; Versões exatas: builds reproduzíveis entre máquinas e no CI.
lib_deps =
    lewisxhe/XPowersLib @ 0.2.7
    bblanchon/ArduinoJson @ 7.4.3
    https://github.com/ricmoo/QRCode.git#eafbde494979abc2445c363cc2602230bcbe299c
    lewisxhe/SensorLib @ 0.4.1

; Os testes unitários rodam no host (env:native), nunca na placa.
test_ignore = *

[env:t5s3-pro-bench]
extends = env:t5s3-pro
build_flags =
    ${env:t5s3-pro.build_flags}
    -D MNEMOS_BENCH_BUILD=1

[env:t5s3-pro-bench-demo]
extends = env:t5s3-pro-bench
build_flags =
    ${env:t5s3-pro-bench.build_flags}
    -D MNEMOS_DEMO_INTERVALS=1

[env:t5s3-pro-bench-ota-source]
extends = env:t5s3-pro-bench
build_flags =
    ${env:t5s3-pro-bench.build_flags}
    -D MNEMOS_OTA_TEST_SOURCE=1

[env:t5s3-pro-bench-ota-target]
extends = env:t5s3-pro-bench
build_flags =
    ${env:t5s3-pro-bench.build_flags}
    -D MNEMOS_OTA_TEST_TARGET=1

; Testes unitários no PC: pio test -e native
; Compila apenas os módulos sem dependência de hardware; Arduino, Wire e
; BQ27220 vêm dos stubs em test/support. O sync_codec é incluído direto
; pela sua suíte, que fornece um Storage falso.
[env:native]
platform = native@1.2.1
test_framework = unity
test_build_src = yes
build_src_filter =
    -<*>
    +<fsrs_engine.cpp>
    +<battery_service.cpp>
build_flags =
    -std=gnu++17
    -I test/support
    -D UNITY_INCLUDE_DOUBLE
    -D UNITY_SUPPORT_64
    -D ARDUINOJSON_ENABLE_ARDUINO_STRING=1
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
build_src_flags =
    -Wall
    -Wextra
lib_ignore =
    BQ27220
    epdiy
