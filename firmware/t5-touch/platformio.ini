[platformio]
default_envs = lilygo-t5-47-s3-touch-bench

[env:lilygo-t5-47-s3-touch]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
board_build.partitions = partitions/mnemos_t5_ota.csv

build_flags =
    -D BOARD_HAS_PSRAM
    -D LILYGO_T5_EPD47_S3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_RUNNING_CORE=1
    -D ARDUINO_EVENT_RUNNING_CORE=1
    -D CORE_DEBUG_LEVEL=0

lib_deps =
    bblanchon/ArduinoJson @ ^7
    https://github.com/ricmoo/QRCode.git
    https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git#esp32s3
    lewisxhe/SensorLib @ ^0.4.1

[env:lilygo-t5-47-s3-touch-bench]
extends = env:lilygo-t5-47-s3-touch
upload_speed = 460800
monitor_speed = 115200
build_flags =
    ${env:lilygo-t5-47-s3-touch.build_flags}
    -DMNEMOS_BENCH_BUILD=1

[env:lilygo-t5-47-s3-touch-bench-demo]
extends = env:lilygo-t5-47-s3-touch-bench
build_flags =
    ${env:lilygo-t5-47-s3-touch-bench.build_flags}
    -DMNEMOS_DEMO_INTERVALS=1

[env:lilygo-t5-47-s3-touch-bench-ota-source]
extends = env:lilygo-t5-47-s3-touch-bench
build_flags =
    ${env:lilygo-t5-47-s3-touch-bench.build_flags}
    -DMNEMOS_OTA_TEST_SOURCE=1

[env:lilygo-t5-47-s3-touch-bench-ota-target]
extends = env:lilygo-t5-47-s3-touch-bench
build_flags =
    ${env:lilygo-t5-47-s3-touch-bench.build_flags}
    -DMNEMOS_OTA_TEST_TARGET=1
